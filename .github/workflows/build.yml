name: Build Masrofy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: unzip -o Masrofy_Android_v*.zip

      - name: Build APK
        run: |
          cd Masrofy_Android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masrofy-APK
          path: Masrofy_Android/app/build/outputs/apk/debug/app-debug.apk
          
