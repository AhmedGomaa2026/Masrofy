name: Build Masrofy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: فك ملف المشروع
        run: |
          unzip -o Masrofy_Android_v1.1.zip
          ls -la Masrofy

      - name: بناء APK
        working-directory: Masrofy
        run: gradle assembleDebug --stacktrace

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: Masrofy-APK
          path: Masrofy/app/build/outputs/apk/debug/app-debug.apk
