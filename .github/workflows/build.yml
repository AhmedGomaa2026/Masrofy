name: Build Masrofy Android
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          ls -la
          if ls Masrofy_Android_v*.zip 1> /dev/null 2>&1; then
            unzip -o Masrofy_Android_v*.zip
          fi
          DIR=$(find. -maxdepth 1 -type d -name "Masrofy_Android_v*" | head -n 1)
          echo "Found dir: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masrofy-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
