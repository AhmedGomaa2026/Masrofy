name: Build Masrofy Android
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          unzip -o Masrofy_Android_v*.zip || true
          PROJECT_DIR=$(find . -type f -name gradlew | head -n 1 | xargs dirname)
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masrofy-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
